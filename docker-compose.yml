# docker compose up --build
#   Dashboard  : http://localhost:8080
#   Swagger UI : http://localhost:8080/swagger-ui.html
#   Kafka UI   : http://localhost:8081
# Redis mode   : NEXUSSAGA_PROVIDER_MODE=redis docker compose --profile redis up --build
name: nexussaga

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nexussaga
      POSTGRES_USER: nexussaga
      POSTGRES_PASSWORD: nexussaga
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexussaga -d nexussaga"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: nexussaga
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8081:8080"
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"

  nexussaga-engine:
    build: .
    image: nexussaga-engine:1.0.0
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/nexussaga
      DB_USER: nexussaga
      DB_PASSWORD: nexussaga
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NEXUSSAGA_PROVIDER_MODE: ${NEXUSSAGA_PROVIDER_MODE:-hazelcast}
      HAZELCAST_MEMBERS: nexussaga-engine
      REDIS_ADDRESS: redis://redis:6379
      NEXUSSAGA_DEMO_ENABLED: "true"
      # Replace both secrets outside local demos (openssl rand -base64 32).
      NEXUSSAGA_HMAC_SECRET: ${NEXUSSAGA_HMAC_SECRET:-change-me-nexussaga-dev-hmac-secret-0123456789}
      NEXUSSAGA_BOOTSTRAP_API_KEY: ${NEXUSSAGA_BOOTSTRAP_API_KEY:-nxs_live_default_key_change_me}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
