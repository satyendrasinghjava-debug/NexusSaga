# PROJECT: NexusSaga - Enterprise Generic Saga Orchestration Engine
# =============================================================================
# Pipeline:
#   1. build-and-test : compile, 129 unit tests, Testcontainers integration test (PostgreSQL + Kafka),
#                       JaCoCo coverage report and job summary, executable jar artifact
#   2. docker-e2e     : builds the Docker image, starts the full docker compose stack and runs
#                       scripts/smoke-test.sh (security, workflow API, 3 chaos scenarios, audit, encryption)
#   3. docs           : rebuilds all documentation PDFs from docs/*.md and publishes them as an artifact
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build · unit tests · integration test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn clean verify (unit + Testcontainers integration tests)
        run: mvn -B -ntp clean verify

      - name: Test and coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv, glob, os, xml.etree.ElementTree as ET
          def suites(pattern):
              t = f = e = s = 0
              for path in glob.glob(pattern):
                  r = ET.parse(path).getroot()
                  t += int(r.get("tests", 0)); f += int(r.get("failures", 0))
                  e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
              return t, f, e, s
          print("## NexusSaga test results\n")
          print("| Suite | Tests | Failures | Errors | Skipped |\n|---|---|---|---|---|")
          for name, pattern in [("Unit tests", "target/surefire-reports/TEST-*.xml"),
                                ("Integration tests", "target/failsafe-reports/TEST-*.xml")]:
              print("| %s | %d | %d | %d | %d |" % ((name,) + suites(pattern)))
          path = "target/site/jacoco/jacoco.csv"
          if os.path.exists(path):
              rows = list(csv.DictReader(open(path)))
              print("\n### Coverage (JaCoCo)\n\n| Metric | Covered |\n|---|---|")
              for kind in ("INSTRUCTION", "BRANCH", "LINE", "METHOD"):
                  m = sum(int(r[kind + "_MISSED"]) for r in rows)
                  c = sum(int(r[kind + "_COVERED"]) for r in rows)
                  print(f"| {kind.title()} | {100 * c / max(1, m + c):.1f}% |")
          EOF

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: nexussaga-engine-jar
          path: target/nexussaga-engine-*.jar

  docker-e2e:
    name: Docker image · compose stack · end-to-end smoke test
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image and start the full stack
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Stack status
        run: docker compose ps

      - name: End-to-end smoke test
        run: ./scripts/smoke-test.sh

      - name: Engine logs on failure
        if: failure()
        run: docker compose logs --no-color nexussaga-engine | tail -300

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  docs:
    name: Documentation PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          pip install markdown playwright
          python -m playwright install --with-deps chromium

      - name: Build all PDFs from docs/*.md
        run: python docs/build_pdfs.py

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: nexussaga-documentation
          path: |
            docs/pdf/
            docs/images/
